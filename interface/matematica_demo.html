<section id="matematica" class="painel texto pagina-matematica" role="tabpanel" aria-labelledby="aba-matematica" hidden>
<h2>A matemática por trás do rosto</h2>
<p>Mexa em uma nota e veja qual parte do rosto muda. Aqui os valores são de exemplo: os controles não alteram as UFs nem os resultados eleitorais.</p>
<div class="laboratorio-face" id="laboratorio-face">
<figure class="desenho-demo">
<svg id="rosto-demo" viewBox="-1.16 -1.16 2.32 2.32" role="img" aria-labelledby="titulo-rosto-demo descricao-rosto-demo">
<title id="titulo-rosto-demo">Rosto de exemplo com cinco notas ajustáveis</title><desc id="descricao-rosto-demo">Cada controle altera um componente do rosto.</desc>
<g transform="scale(1,-1)" stroke="#263238" stroke-linejoin="round" stroke-linecap="round">
<polygon id="demo-cor" stroke-width=".018"></polygon>
<g id="demo-olhos" stroke-width=".022"><polygon id="demo-olho-esquerdo" fill="white"></polygon><polygon id="demo-pupila-esquerda" fill="#263238" stroke="none"></polygon><polygon id="demo-olho-direito" fill="white"></polygon><polygon id="demo-pupila-direita" fill="#263238" stroke="none"></polygon></g>
<polyline id="demo-nariz" fill="none" stroke-width=".019"></polyline>
<g stroke-width=".032"><line id="demo-sobrancelha-esquerda"></line><line id="demo-sobrancelha-direita"></line></g>
<polygon id="demo-boca" fill="#263238" stroke-width=".019"></polygon>
</g></svg>
<figcaption>Exemplo hipotético · mesmas coordenadas usadas no R.</figcaption>
<svg id="demo-velocimetro" viewBox="-1.25 -1.25 2.5 1.62" role="img" aria-label="Ponteiro de exemplo, ligado à nota da cor da face"><g transform="scale(1,-1)"><g id="demo-faixa"></g><line id="demo-ponteiro" x1="0" y1="0" stroke="#263238" stroke-width=".035"></line><circle r=".045" fill="#263238"></circle></g><text x="-1.05" y=".19">0</text><text x="0" y="-1.11">5</text><text x="1.05" y=".19">10</text></svg>
<p class="micro">Este ponteiro acompanha a nota da cor da face.</p>
</figure>
<div class="controles-demo">
<div class="controle-demo"><label for="slider-presidente">Cor da face <span>Presidência</span></label><output id="valor-presidente" for="slider-presidente">5,0</output><input id="slider-presidente" type="range" min="0" max="10" step="0.1" value="5"><p id="parametro-presidente"></p></div>
<div class="controle-demo"><label for="slider-governador">Abertura dos olhos <span>Governo estadual</span></label><output id="valor-governador" for="slider-governador">5,0</output><input id="slider-governador" type="range" min="0" max="10" step="0.1" value="5"><p id="parametro-governador"></p></div>
<div class="controle-demo"><label for="slider-senador">Abertura do sorriso <span>Senado</span></label><output id="valor-senador" for="slider-senador">5,0</output><input id="slider-senador" type="range" min="0" max="10" step="0.1" value="5"><p id="parametro-senador"></p></div>
<div class="controle-demo"><label for="slider-federal">Formato do nariz <span>Deputados federais</span></label><output id="valor-federal" for="slider-federal">5,0</output><input id="slider-federal" type="range" min="0" max="10" step="0.1" value="5"><p id="parametro-federal"></p></div>
<div class="controle-demo"><label for="slider-estadual">Altura das sobrancelhas <span>Estaduais / distritais</span></label><output id="valor-estadual" for="slider-estadual">5,0</output><input id="slider-estadual" type="range" min="0" max="10" step="0.1" value="5"><p id="parametro-estadual"></p></div>
<div class="rodape-controles"><span>0 = esquerda · 10 = direita</span><button type="button" id="demo-reiniciar">Voltar para 5</button></div>
</div>
</div>
